[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "mock-core-banking"
version = "0.2.0"
description = "AegisBank AI Platform - Mock Core Banking System v0.2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.52",
    "starlette==1.6.0",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.12.0",
    "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mock_core_banking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
