[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "aegisbank-agent"
version = "0.7.0.dev0"
description = "Single-agent orchestrator with MCP and human-approved tools for AegisBank AI Platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "openai==3.5.0",
    "mcp==2.1.1",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pydantic==2.13.4",
    "aegisbank-rag>=0.4.0",
    "mock-core-banking>=0.2.0",
    "azure-servicebus==7.14.3",
    "azure-cosmos>=4.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[project.scripts]
aegisbank-agent = "aegisbank_agent.cli:main"
aegisbank-mcp-demo = "aegisbank_agent.hitl_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisbank_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
