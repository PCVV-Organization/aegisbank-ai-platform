# AegisBank AI Platform local Docker Compose environment v0.11.0.
# Status: LAB-COVERED / CLOUD-PENDING; Foundry Local remains on the host.

name: aegisbank-local

services:
  mock-core-banking:
    build:
      context: ../../services/mock-core-banking
      dockerfile: Dockerfile
    image: aegisbank/mock-core-banking:0.11.0
    container_name: aegisbank-mock-core-banking
    ports:
      - "8000:8000"
    environment:
      AEGISBANK_ENV: "container"
      AEGISBANK_DATABASE_URL: "sqlite:////app/data/aegisbank-dev.db"
    networks:
      - aegisbank-net
    volumes:
      - core-banking-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aegisbank-mssql-emulator
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the shell; never commit it}
    networks:
      - aegisbank-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: aegisbank-servicebus-emulator
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
    ports:
      - "5672:5672"
    environment:
      SQL_SERVER: "mssql"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the shell; never commit it}
      ACCEPT_EULA: "Y"
    volumes:
      - ./Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    networks:
      - aegisbank-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5672'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  postgres-pgvector:
    profiles: ["data"]
    image: pgvector/pgvector:0.8.0-pg17
    container_name: aegisbank-postgres-pgvector
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aegisbank_rag
      POSTGRES_USER: aegisuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the shell; never commit it}
    networks:
      - aegisbank-net
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisuser -d aegisbank_rag"]
      interval: 5s
      timeout: 3s
      retries: 10
  cosmos-emulator:
    profiles: ["cosmos", "data"]
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    container_name: aegisbank-cosmos-emulator
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "8080:8080"
      - "1234:1234"
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 4
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_EXPLORER: "true"
    networks:
      - aegisbank-net
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f http://127.0.0.1:8080/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  redis:
    profiles: ["redis", "data"]
    image: redis/redis-stack-server:latest
    container_name: aegisbank-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      REDIS_ARGS: "--save 60 1 --loglevel notice"
    networks:
      - aegisbank-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

networks:
  aegisbank-net:
    driver: bridge

volumes:
  core-banking-data:
    name: aegisbank-core-banking-data
  pgvector-data:
    name: aegisbank-pgvector-data
