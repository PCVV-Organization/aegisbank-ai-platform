name: Azure foundation validation

on:
  pull_request:
    paths:
      - 'deploy/azure/**'
      - '.github/workflows/azure-validate.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate-iac:
    name: Compile Azure foundation without deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Azure CLI
        uses: azure/setup-azure@v2
      - name: Compile Bicep
        run: az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
      - name: Explain deployment boundary
        run: |
          echo 'No Azure login, resource creation, secret access, or deployment runs in this workflow.'
          echo 'The id-token permission permits a separately approved environment deployment workflow to use OIDC.'
