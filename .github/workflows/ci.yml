name: AegisBank Quality Pipeline

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and DevSecOps gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install local packages and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'ai/rag[dev]' -e 'services/mock-core-banking[dev]' -e 'ai/agent[dev]' -e 'ml/intent-classifier[dev]'
          python -m pip install bandit==1.9.4 pip-audit==2.10.1 pytest-cov==7.0.0
      - name: Run local quality gate
        run: python scripts/quality_gate.py
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aegisbank-quality-reports
          path: artifacts/quality
